[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyadaptagrams"
version = "0.1.0"
description = "Adaptagrams layout and routing for native igraph graphs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LGPL-2.1-or-later"}
authors = [{name = "pyadaptagrams contributors"}]
dependencies = [
    "igraph>=0.11,<2",
    "numpy>=1.23",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
]

[project.optional-dependencies]
dataframe = ["pandas>=2"]
test = ["pytest>=8"]

[tool.scikit-build]
cmake.source-dir = "vendor"
wheel.packages = ["src/pyadaptagrams"]
sdist.include = ["vendor/**", "tests/**", "examples/**"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
